<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter Two - Our Favorite Memories</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Link to your CSS file -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="min-h-screen flex items-center justify-center p-2 sm:p-6 md:p-10 select-none">

    <!-- SCRAPBOOK CONTAINER -->
    <div class="scrapbook-book relative w-full max-w-4xl bg-[#f8ece9] rounded-2xl overflow-hidden my-auto border-4 border-[#e2cdc7]">
        <div class="grid grid-cols-12 min-h-[780px]">
            
            <!-- LEFT COLUMN: SPIRAL BINDER RINGS -->
            <div class="col-span-1 border-r-2 border-[#d8beba] bg-[#efe1dc] relative flex flex-col justify-between py-10 items-center z-30 shadow-inner">
                <script>
                    for(let i=0; i<14; i++) {
                        document.write(`
                            <div class="relative w-full flex justify-center items-center my-1.5">
                                <div class="spiral-hole w-3 h-3 rounded-full"></div>
                                <div class="absolute -left-2 w-7 h-3 rounded-full border-t-4 border-b-2 border-gray-400 bg-gradient-to-r from-gray-200 via-gray-100 to-gray-500 shadow-md transform -rotate-12"></div>
                            </div>
                        `);
                    }
                </script>
            </div>

            <!-- RIGHT COLUMN: MAIN PAGE CONTENT -->
            <div class="col-span-11 paper-page relative p-6 md:p-10 flex flex-col justify-between overflow-hidden">
                
                <!-- HEADER SECTION -->
                <div class="text-center space-y-1 mt-1 z-10">
                    <p class="tracking-[0.3em] text-xs md:text-sm font-semibold text-[#8c5962] uppercase">Chapter Two</p>
                    <div class="text-[#b35368] text-sm">♡</div>
                    <h1 class="font-serif text-2xl md:text-4xl font-bold text-[#5a222e] tracking-tight py-0.5" style="font-family: 'Playfair Display', serif;">
                        Our Favorite Memories
                    </h1>
                    <p class="font-handwriting text-base md:text-lg text-[#b35368]" style="font-family: 'Caveat', cursive;">
                        Every picture has a story... and every story with you is my favorite.
                    </p>
                </div>

                <!-- PHOTO GRID SECTION (4 POLAROID TILES) -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 md:gap-6 my-4 z-10 max-w-2xl mx-auto w-full">
                    
                    <!-- PHOTO CARD 1 -->
                    <div class="memory-grid-card p-3 rounded-sm transform -rotate-2 relative group">
                        <div class="tape-top-left absolute -top-2.5 left-4 w-16 h-5 z-20 transform -rotate-6"></div>
                        <div class="relative aspect-[4/3] bg-gray-100 overflow-hidden rounded-xs">
                            <img id="grid-img-1" src="photo4.jpeg" alt="Memory 1" class="w-full h-full object-cover">
                            <label for="upload-1" class="absolute inset-0 bg-black/40 text-white opacity-0 group-hover:opacity-100 flex flex-col items-center justify-center cursor-pointer transition-opacity text-xs">
                                <i class="fa-solid fa-camera text-xl mb-1"></i> Replace Photo
                            </label>
                            <input type="file" id="upload-1" accept="image/*" class="hidden" onchange="updatePhoto(event, 'grid-img-1')">
                        </div>
                        <div class="text-center pt-2">
                            <p class="font-handwriting text-base text-gray-800" style="font-family: 'Caveat', cursive;">The day u asked me to be your gf</p>
                        </div>
                    </div>

                    <!-- PHOTO CARD 2 (TWO PHOTOS SIDE-BY-SIDE) -->
<div class="memory-grid-card p-3 rounded-sm transform rotate-2 relative group">
    <div class="tape-top-right absolute -top-2.5 right-4 w-16 h-5 z-20 transform rotate-6"></div>
    
    <!-- TWO-PHOTO GRID CONTAINER -->
    <div class="grid grid-cols-2 gap-1.5 aspect-[4/3] bg-gray-100 rounded-xs overflow-hidden p-1">
        <div class="relative overflow-hidden h-full rounded-xs">
            <img src="photo2a.jpeg" alt="Memory 2 Part A" class="w-full h-full object-cover">
        </div>
        <div class="relative overflow-hidden h-full rounded-xs">
            <img src="photo2b.jpeg" alt="Memory 2 Part B" class="w-full h-full object-cover">
        </div>
    </div>

    <div class="text-center pt-2">
        <p class="font-handwriting text-base text-gray-800" style="font-family: 'Caveat', cursive;">Two special moments from the same day ♡</p>
    </div>
</div>

                    <!-- PHOTO CARD 3 -->
                    <div class="memory-grid-card p-3 rounded-sm transform rotate-1 relative group">
                        <div class="tape-yellow absolute -top-2.5 left-1/2 -translate-x-1/2 w-16 h-5 z-20 transform -rotate-2"></div>
                        <div class="relative aspect-[4/3] bg-gray-100 overflow-hidden rounded-xs">
                            <img id="grid-img-3" src="photo8.jpeg" alt="Memory 3" class="w-full h-full object-cover">
                            <label for="upload-3" class="absolute inset-0 bg-black/40 text-white opacity-0 group-hover:opacity-100 flex flex-col items-center justify-center cursor-pointer transition-opacity text-xs">
                                <i class="fa-solid fa-camera text-xl mb-1"></i> Replace Photo
                            </label>
                            <input type="file" id="upload-3" accept="image/*" class="hidden" onchange="updatePhoto(event, 'grid-img-3')">
                        </div>
                        <div class="text-center pt-2">
                            <p class="font-handwriting text-base text-gray-800" style="font-family: 'Caveat', cursive;">when u finally met my family</p>
                        </div>
                    </div>

                    <!-- PHOTO CARD 4 -->
                    <div class="memory-grid-card p-3 rounded-sm transform -rotate-2 relative group">
                        <div class="tape-top-left absolute -top-2.5 right-6 w-16 h-5 z-20 transform rotate-12"></div>
                        <div class="relative aspect-[4/3] bg-gray-100 overflow-hidden rounded-xs">
                            <img id="grid-img-4" src="photo7.jpeg" alt="Memory 4" class="w-full h-full object-cover">
                            <label for="upload-4" class="absolute inset-0 bg-black/40 text-white opacity-0 group-hover:opacity-100 flex flex-col items-center justify-center cursor-pointer transition-opacity text-xs">
                                <i class="fa-solid fa-camera text-xl mb-1"></i> Replace Photo
                            </label>
                            <input type="file" id="upload-4" accept="image/*" class="hidden" onchange="updatePhoto(event, 'grid-img-4')">
                        </div>
                        <div class="text-center pt-2">
                            <p class="font-handwriting text-base text-gray-800" style="font-family: 'Caveat', cursive;">The sweetest random moments</p>
                        </div>
                    </div>

                </div>

                <!-- FOOTER & PAGE NAVIGATION -->
                <div class="flex justify-between items-center pt-4 border-t border-[#ebdad5] z-10">
                    <a href="index.html" class="bg-[#e8dad6] hover:bg-[#d4c0bb] text-[#5a222e] font-medium text-xs md:text-sm px-5 py-2 rounded-full transition-all duration-300 flex items-center gap-2">
                        <i class="fa-solid fa-arrow-left text-xs"></i>
                        <span>Previous</span>
                    </a>
                    
                    <div class="flex items-center gap-4">
                        <a href="page3.html" class="bg-[#b35368] hover:bg-[#5a222e] text-white font-medium text-xs md:text-sm px-6 py-2 rounded-full transition-all duration-300 shadow-md hover:shadow-lg flex items-center gap-2 group">
                            <span>Turn page</span>
                            <i class="fa-solid fa-arrow-right text-xs group-hover:translate-x-1 transition-transform"></i>
                        </a>
                        <span class="font-serif text-xs text-[#8c5962] font-semibold">02</span>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Script for updating images in grid -->
    <script>
        function updatePhoto(event, elementId) {
            const reader = new FileReader();
            reader.onload = function() {
                const img = document.getElementById(elementId);
                img.src = reader.result;
            };
            if(event.target.files[0]) {
                reader.readAsDataURL(event.target.files[0]);
            }
        }
    </script>
</body>
</html>
